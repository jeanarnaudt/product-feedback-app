<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <link rel="stylesheet" href="/css/main.css" />
    <style>
        .error { max-width: 720px; margin: 10vh auto; text-align: center; padding: 2rem; }
        .error h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        .error p { color: #555; }
        .error a { display: inline-block; margin-top: 1rem; }
    </style>
    </head>
<body>
<main class="error">
    <h1>404</h1>
    <h2>Sorry, we couldn't find that.</h2>
    <p th:text="${message}">The page or resource you requested was not found.</p>
    <a href="/">Back to Home</a>
 </main>
</body>
</html>
