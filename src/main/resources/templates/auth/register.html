<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Register • Product Feedback</title>
    <meta charset="UTF-8"/>
    
</head>
<body>
<section>
    <div class="container">
        <h1>Create your account</h1>
        <div class="card">
            <form th:action="@{/auth/register}" method="post" th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" th:field="*{username}" type="text" required/>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" th:field="*{email}" type="email" required/>
                </div>
                <div class="field">
                    <label for="displayName">Display name</label>
                    <input id="displayName" th:field="*{displayName}" type="text" required/>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" th:field="*{password}" type="password" required/>
                </div>
                <div class="errors" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                <a th:href="@{/auth/login}" class="btn btn-link">Back to login</a>
            </form>
        </div>
    </div>
    
</section>
</body>
</html>
