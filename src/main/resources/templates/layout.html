<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Product Feedback</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css"/>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header class="site-header" role="banner">
    <div class="container header-inner">
        <a class="logo" th:href="@{/}" aria-label="Product Feedback home">ProductFeedback</a>
        <nav class="nav" role="navigation" aria-label="Main navigation">
            <a th:href="@{/feedback}" class="nav-link">Feedback</a>
            <a th:href="@{/roadmap}" class="nav-link">Roadmap</a>
        </nav>
        <div class="auth">
            <div th:if="${#httpServletRequest.userPrincipal == null}">
                <a th:href="@{/auth/login}" class="btn btn-link">Login</a>
                <a th:href="@{/auth/register}" class="btn btn-primary">Register</a>
            </div>
            <div th:if="${#httpServletRequest.userPrincipal != null}">
                <a th:href="@{/profile}" class="btn btn-link">My Profile</a>
                <form th:action="@{/auth/logout}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-secondary">Logout</button>
                </form>
            </div>
        </div>
    </div>
</header>

<main id="main" class="container" tabindex="-1">
    <div th:replace="${content}">
        <section>
            <h1>Content</h1>
            <p>This is the default content.</p>
        </section>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}">2025</span> Product Feedback</p>
    </div>
    
</footer>
</body>
</html>
