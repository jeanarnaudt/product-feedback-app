<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>New Feedback • Product Feedback</title>
</head>
<body>
<section>
    <div class="container">
        <h1>New Feedback</h1>
        <div class="card">
            <form th:action="@{/feedback}" method="post" th:object="${feedback}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="field">
                    <label for="title">Title</label>
                    <input id="title" th:field="*{title}" type="text" required/>
                    <div class="errors" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" required></textarea>
                    <div class="errors" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>
                <div class="field">
                    <label for="categoryId">Category</label>
                    <select id="categoryId" th:field="*{categoryId}">
                        <option value="" disabled selected>Select a category</option>
                        <option value="1">Feature</option>
                        <option value="2">UI</option>
                        <option value="3">UX</option>
                        <option value="4">Enhancement</option>
                        <option value="5">Bug</option>
                    </select>
                    <div class="errors" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Create</button>
                <a th:href="@{/feedback}" class="btn btn-link">Cancel</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
