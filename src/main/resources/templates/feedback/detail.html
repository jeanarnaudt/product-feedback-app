<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${feedback.title} + ' • Product Feedback'">Feedback Detail</title>
</head>
<body>
<section>
    <div class="container">
        <div class="card">
            <h1 th:text="${feedback.title}">Feedback title</h1>
            <p class="meta">
                <span th:text="${feedback.categoryName}">Category</span>
                • <span th:text="${feedback.status}">Status</span>
            </p>
            <p th:text="${feedback.description}">Description</p>
            <div style="display:flex; gap:8px; align-items:center;">
                <form th:action="@{|/feedback/${feedback.id}/upvote|}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-secondary" type="submit">Upvote</button>
                </form>
                <a th:href="@{|/feedback/${feedback.id}/edit|}" class="btn btn-link">Edit</a>
            </div>
        </div>

        <div class="card">
            <h3>Comments</h3>
            <div th:if="${#lists.isEmpty(feedback.comments)}" class="meta">No comments yet.</div>
            <div th:each="c : ${feedback.comments}" class="card" style="margin-left:0;">
                <strong th:text="${c.authorDisplayName}">User</strong>
                <p th:text="${c.content}">Comment content</p>
                <div class="meta" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}"
                     >2025-01-01</div>
                <!-- Replies (if any) -->
                <div th:if="${!#lists.isEmpty(c.replies)}" style="margin-left:16px;">
                    <div th:each="r : ${c.replies}" class="card">
                        <strong th:text="${r.authorDisplayName}">User</strong>
                        <p th:text="${r.content}">Reply content</p>
                        <div class="meta" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Add a comment</h3>
            <form th:action="@{|/feedback/${feedback.id}/comments|}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="field">
                    <label for="content">Comment</label>
                    <textarea id="content" name="content" placeholder="Type your comment..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Post Comment</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
